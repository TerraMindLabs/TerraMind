version: 1.1.5
cache: true
interface:
  marketplace:
    use: true
endpoints:
  agents:
    models: ["gemini-3.5-flash-lite", "gemini-1.5-flash-latest"]
    capabilities:
      - "tools"
      - "actions"
      - "skills"
      - "artifacts"
      - "context"
  google: {}
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "terraform-devops-expert"
      label: "Terraform DevOps Expert"
      description: "Principal Cloud Architect that writes modular, secure, and validated Terraform code — with automated project organization, self-correction, and human approval gates."
      iconURL: "/assets/only_logo.png"
      default: true
      preset:
        endpoint: "agents"
        agent_id: "agent_tf-devops-expert"
    - name: "finops-cost-optimizer"
      label: "FinOps & Cloud Cost Optimizer"
      description: "Principal Cloud Economist that analyzes IaC, delivers multi-cloud cost comparisons (AWS vs GCP vs Azure), and recommends aggressive rightsizing and Spot/Graviton savings."
      iconURL: "/assets/only_logo.png"
      preset:
        endpoint: "agents"
        agent_id: "agent_finops-cost-optimizer"
    - name: "k8s-gitops-architect"
      label: "Kubernetes & GitOps Platform Engineer"
      description: "Principal Kubernetes Platform Architect that designs workload-tailored manifests, production resource sizing, resilient health probes, Helm charts, and GitOps rollouts."
      iconURL: "/assets/only_logo.png"
      preset:
        endpoint: "agents"
        agent_id: "agent_k8s-gitops-architect"
    - name: "cicd-pipeline-engineer"
      label: "CI/CD Pipeline Engineer"
      description: "Principal DevSecOps Engineer that designs multi-stage CI/CD pipelines (GitHub Actions, GitLab CI) with OIDC keyless authentication, security gates, PR plan comments, and state locking."
      iconURL: "/assets/only_logo.png"
      preset:
        endpoint: "agents"
        agent_id: "agent_cicd-pipeline-engineer"
mcpServers:
  terraform-registry:
    type: stdio
    command: npx
    args: ["-y", "terraform-mcp-server"]
  local-fs:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "REPLACE_WITH_TF_WORKSPACE"]
  tf-runner:
    type: stdio
    command: node
    args: ["REPLACE_WITH_MCP_RUNNER_PATH"]
