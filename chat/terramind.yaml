version: 1.1.5
cache: true
endpoints:
  agents:
    models: ["gemini-3.5-flash-lite", "gemini-1.5-flash-latest", "llama3.2", "llama3.1", "qwen2.5-coder:3b", "qwen2.5-coder:7b", "mistral-nemo", "qwen2.5-coder:14b"]
  google: {}
  custom:
        - name: "Ollama"
          apiKey: "ollama"
          baseURL: "http://127.0.0.1:11434/v1"
          models:
            default: ["llama3.2", "qwen2.5-coder:3b"]
            fetch: true
          titleConvo: true
          titleModel: "current_model"
          summarize: false
          displayInFilter: true
mcpServers:
  terraform-registry:
    type: stdio
    command: npx
    args: ["-y", "terraform-mcp-server"]
  local-fs:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "REPLACE_WITH_TF_WORKSPACE"]
  tf-runner:
    type: stdio
    command: node
    args: ["REPLACE_WITH_MCP_RUNNER_PATH"]
