version: 1.1.5
cache: true
endpoints:
  agents:
    models: ["gemini-3.5-flash-lite", "gemini-1.5-flash-latest"]
  google: {}
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "terraform-devops-expert"
      label: "Terraform DevOps Expert"
      description: "Automates Terraform infrastructure creation, validation, and deployment."
      iconURL: "/assets/only_logo.png"
      default: true
      preset:
        endpoint: "agents"
        agent_id: "agent_tf-devops-expert"
mcpServers:
  terraform-registry:
    type: stdio
    command: npx
    args: ["-y", "terraform-mcp-server"]
  local-fs:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "REPLACE_WITH_TF_WORKSPACE"]
  tf-runner:
    type: stdio
    command: node
    args: ["REPLACE_WITH_MCP_RUNNER_PATH"]
